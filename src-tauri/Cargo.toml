[package]
name = "dnake-simulator"
version = "0.1.0"
description = "Fake DNAKE device registration and settings polling for testing"
edition = "2021"

[lib]
name = "dnake_simulator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
